{{ partial "header.html" . }}

<main class="content" role="main">

  <article class="article">
    <h1 class="article-title">{{ .Title }}</h1>
    <div class="article-content">
      {{ .Content }}
      <div class="archive">
        {{ range (where (where site.RegularPages "Section" "post") "Params.series" .Params.series).ByPublishDate }}
        <article class="archive-item">
          <a href="{{ .RelPermalink }}" class="archive-item-link">{{ .Title }}</a>
          <span class="archive-item-date">{{ .Date.Format "January 2, 2006" }}</span>
        </article>
        {{ end }}
      </div>
    </div>
  </article>

</main>

{{ partial "footer.html" . }}
